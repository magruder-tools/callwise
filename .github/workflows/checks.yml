name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax and metadata
        run: |
          npm run check 2>&1 | tee check.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Tests
        run: |
          npm test 2>&1 | tee test.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Capture renderer context
        if: failure()
        run: nl -ba ui/app.mjs | sed -n '425,445p' > renderer-lines.log
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser for layout checks
        run: npx playwright install --with-deps chromium
      - name: Verify the shipped renderer at the brief's window sizes
        run: npm run test:ui
      - name: Upload renderer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Callwise-browser-validation
          path: artifacts/browser/*.png
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: callwise-check-diagnostics
          path: |
            check.log
            test.log
            renderer-lines.log
          if-no-files-found: ignore
