name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: UI ownership
        if: github.event_name == 'pull_request'
        run: node scripts/check-ui-ownership.mjs
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - run: npm ci --ignore-scripts
      - name: Electron desktop smoke
        timeout-minutes: 3
        run: |
          node node_modules/electron/install.js
          xvfb-run -a node_modules/.bin/electron . --smoke --no-sandbox
      - name: Syntax and metadata
        run: |
          npm run check 2>&1 | tee check.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Tests
        run: |
          npm test 2>&1 | tee test.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Prepared-card matcher and timing replay
        run: npm run test:match && npm run test:replay
      - name: Capture renderer context
        if: failure()
        run: nl -ba ui/app.mjs | sed -n '425,445p' > renderer-lines.log
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser for layout checks
        run: npx playwright install --with-deps chromium
      - name: Verify the shipped renderer at the brief's window sizes
        run: npm run test:ui && npm run test:meetings
      - name: Upload renderer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Callwise-browser-validation
          path: artifacts/browser/**/*.png
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: callwise-check-diagnostics
          path: |
            check.log
            test.log
            renderer-lines.log
          if-no-files-found: ignore
