name: One-time CALLWISE storage cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-2026-09-17.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: callwise-storage-cleanup-2026-09-17
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove seven approved old downloads and preserve build 10130393563
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request
          
          REPOSITORY = "magruder-tools/callwise"
          KEEP_RUN = 34419509313
          KEEP = [{"id":10130394187,"name":"Callwise-Mac-validation","size_in_bytes":202610},{"id":10130393563,"name":"Callwise-Apple-Silicon","size_in_bytes":215735590},{"id":10130354779,"name":"Callwise-source","size_in_bytes":260344}]
          TARGETS = [{"id":10129204844,"name":"Callwise-Apple-Silicon","size_in_bytes":215732526,"run":34416242949},{"id":10129061945,"name":"Callwise-Apple-Silicon","size_in_bytes":215732299,"run":34415856384},{"id":10128964948,"name":"Callwise-Apple-Silicon","size_in_bytes":215732299,"run":34415540410},{"id":10128880376,"name":"Callwise-Apple-Silicon","size_in_bytes":215730539,"run":34415372341},{"id":9995536259,"name":"Callwise-Apple-Silicon","size_in_bytes":215728287,"run":34054411833},{"id":9995479721,"name":"Callwise-Apple-Silicon","size_in_bytes":215728287,"run":34054190754},{"id":9994799329,"name":"Callwise-Apple-Silicon","size_in_bytes":128454267,"run":34051891289}]
          if os.environ.get("GITHUB_REPOSITORY") != REPOSITORY:
              raise RuntimeError("Unexpected repository; no artifacts deleted")
          
          base = "https://api.github.com/repos/" + REPOSITORY
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          
          def request(path, method="GET"):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          
          def artifact(artifact_id):
              try:
                  return request("/actions/artifacts/" + str(artifact_id))
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise
          
          run = request("/actions/runs/" + str(KEEP_RUN))
          if run["status"] != "completed" or run["conclusion"] != "success":
              raise RuntimeError("Preserved build is not successful; no artifacts deleted")
          keep_ids = {item["id"] for item in KEEP}
          if keep_ids.intersection(item["id"] for item in TARGETS):
              raise RuntimeError("Protected artifact included in targets; no artifacts deleted")
          protected = []
          for expected in KEEP:
              actual = artifact(expected["id"])
              if (not actual or actual["expired"]
                      or actual["name"] != expected["name"]
                      or actual["size_in_bytes"] != expected["size_in_bytes"]
                      or actual["workflow_run"]["id"] != KEEP_RUN):
                  raise RuntimeError("Preserved artifact validation failed; no artifacts deleted")
              protected.append(actual)
          build = next(item for item in protected if item["name"] == "Callwise-Apple-Silicon")
          ready = []
          for expected in TARGETS:
              actual = artifact(expected["id"])
              if actual is None:
                  print("Already removed:", expected["id"])
                  continue
              if (actual["name"] != "Callwise-Apple-Silicon"
                      or actual["name"] != expected["name"]
                      or actual["size_in_bytes"] != expected["size_in_bytes"]
                      or actual["workflow_run"]["id"] != expected["run"]
                      or actual["created_at"] >= build["created_at"]
                      or actual["workflow_run"]["id"] == KEEP_RUN):
                  raise RuntimeError("Target validation failed; no artifacts deleted")
              ready.append(actual)
          
          print("Validated preserved build:", build["id"], build["size_in_bytes"], "bytes")
          print("Validated deletion targets:", len(ready))
          freed = 0
          for item in ready:
              request("/actions/artifacts/" + str(item["id"]), method="DELETE")
              freed += item["size_in_bytes"]
              print("Removed older app download:", item["id"], item["size_in_bytes"], "bytes")
          
          for expected in KEEP:
              actual = artifact(expected["id"])
              if not actual or actual["expired"] or actual["size_in_bytes"] != expected["size_in_bytes"]:
                  raise RuntimeError("Post-cleanup preserved artifact verification failed")
          for expected in TARGETS:
              if artifact(expected["id"]) is not None:
                  raise RuntimeError("Post-cleanup target still exists")
          summary = ("Removed " + str(len(ready)) + " older Mac app downloads. Freed "
                     + str(freed) + " bytes. Preserved latest build and matching source/validation artifacts.")
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary + "\n")
          
