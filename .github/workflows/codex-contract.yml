name: Codex protocol contract
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/codex-contract.yml'
      - 'providers/codex*.mjs'
      - 'scripts/codex-contract.mjs'
  pull_request:
    paths:
      - 'providers/codex*.mjs'
      - 'scripts/codex-contract.mjs'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install the verified public CLI version
        run: npm install --prefix /tmp/callwise-contract @openai/codex@0.153.4
      - name: Verify handshake and restrictive configuration without credentials or inference
        env:
          CALLWISE_CODEX_BIN: /tmp/callwise-contract/node_modules/.bin/codex
        run: node scripts/codex-contract.mjs | tee codex-contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: codex-contract-result
          path: codex-contract.json
          retention-days: 7
          if-no-files-found: error
