name: Mac download
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/followup-fixes
    tags:
      - "v[0-9]*"
    paths:
      - ".github/workflows/mac-download.yml"
      - "desktop/**"
      - "core/**"
      - "providers/**"
      - "ui/**"
      - "build/**"
      - "scripts/**"
      - "tests/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
permissions:
  contents: read
concurrency:
  group: callwise-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supersede:
    name: Stop superseded preview builds
    if: github.ref == 'refs/heads/claude/followup-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel older runs from this preview branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs?event=push&branch=claude%2Ffollowup-fixes&per_page=100" --jq '.workflow_runs[] | select(.path == ".github/workflows/mac-download.yml" and .head_sha != env.GITHUB_SHA and (.status == "queued" or .status == "in_progress")) | .id' > old-runs.txt
          while read -r run; do gh run cancel "$run" --repo "$GH_REPO" || true; done < old-runs.txt
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          git archive --format=zip --prefix=Callwise-source/ HEAD > Callwise-source.zip
          git rev-parse HEAD > BUILD_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Callwise-source
          path: |
            Callwise-source.zip
            BUILD_COMMIT.txt
          retention-days: 30
  mac:
    # The native helper targets macOS 26, but builds with the macOS 27 SDK.
    # Xcode 26's compiler rejects the pinned FluidAudio dependency.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      CALLWISE_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/claude/followup-fixes') && '1' || '0' }}
      CALLWISE_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'preview' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate tagged version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("package.json")).version; if(process.env.RELEASE_TAG!==`v${v}`) throw new Error("Tag must match package version");'
      - name: Checks and tests on macOS
        run: |
          npm run check 2>&1 | tee check.log
          npm test 2>&1 | tee test.log
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log
      - name: Verify pinned local speaker assets
        run: npm run models:fetch
      - name: Build native meeting engine
        run: npm run build:native
      - name: Native Electron smoke test without keys or recording
        run: npm start -- --smoke 2>&1 | tee smoke.log
      - name: Import persistent identity when configured
        env:
          CALLWISE_SIGNING_P12: ${{ secrets.CALLWISE_SIGNING_P12 }}
          CALLWISE_SIGNING_PASSWORD: ${{ secrets.CALLWISE_SIGNING_PASSWORD }}
        run: node scripts/import-signing-identity.mjs
      - name: Build Apple Silicon DMG and ZIP
        run: |
          npm run dist:mac -- --config.extraMetadata.releaseChannel="$CALLWISE_BUILD_CHANNEL" 2>&1 | tee package.log
          git rev-parse HEAD > release/BUILD_COMMIT.txt
          shasum -a 256 release/*.zip release/*.dmg > release/SHA256SUMS.txt
          /usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' release/mac-arm64/Callwise.app/Contents/Info.plist
          file release/mac-arm64/Callwise.app/Contents/MacOS/Callwise
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Callwise.app 2>&1 | tee signature.log
          codesign -d -r- release/mac-arm64/Callwise.app > release/SIGNATURE.txt 2>&1
          if [ -n "${CALLWISE_SIGN_IDENTITY:-}" ]; then
            printf '%s\n' 'Signed with the persistent Callwise identity. This build is not Apple-notarized.' > release/SIGNING.txt
          else
            printf '%s\n' 'Personal Mac build with an ad-hoc signature. macOS may require Open Anyway and renewed microphone/system-audio permissions after an upgrade. This build is not Apple-notarized.' > release/SIGNING.txt
          fi
      - name: Verify the bundled Codex helper without account credentials
        run: |
          export CALLWISE_CODEX_BIN="$PWD/release/mac-arm64/Callwise.app/Contents/Resources/codex/codex"
          node scripts/codex-contract.mjs 2>&1 | tee bundled-codex.log
      - name: Launch the actual packaged app with synthetic data only
        run: |
          export CALLWISE_SMOKE_DIR="$PWD/artifacts/packaged"
          release/mac-arm64/Callwise.app/Contents/MacOS/Callwise --smoke 2>&1 | tee packaged-smoke.log
      - name: Verify the actual bundled library and background restore
        run: |
          ELECTRON_RUN_AS_NODE=1 release/mac-arm64/Callwise.app/Contents/MacOS/Callwise scripts/verify-packaged-library.mjs "$PWD/release/mac-arm64/Callwise.app/Contents/Resources/app.asar" 2>&1 | tee packaged-library.log
      - uses: actions/upload-artifact@v4
        with:
          name: Callwise-Apple-Silicon
          path: |
            release/*.zip
            release/*.dmg
            release/BUILD_COMMIT.txt
            release/SHA256SUMS.txt
            release/SIGNATURE.txt
            release/SIGNING.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Callwise-Mac-validation
          path: |
            check.log
            test.log
            audit.log
            smoke.log
            package.log
            signature.log
            bundled-codex.log
            packaged-smoke.log
            packaged-library.log
            artifacts/**/*.png
          retention-days: 30
          if-no-files-found: ignore
  renderer:
    name: Verify meeting screens
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui && npm run test:meetings
  publish:
    name: Publish the verified personal Mac build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/claude/followup-fixes'
    needs: [source, mac, renderer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Callwise-Apple-Silicon
          path: release
      - name: Publish checked installers and immutable release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-mac-release.mjs
